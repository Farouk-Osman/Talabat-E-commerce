$kind: http-request
name: Reset Password
method: PUT
url: '{{baseUrl}}/api/v1/auth/resetPassword'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "newPassword": "newpassword123"
    }
auth:
  type: noauth
