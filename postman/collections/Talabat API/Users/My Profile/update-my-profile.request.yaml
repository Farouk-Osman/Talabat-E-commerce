$kind: http-request
name: Update My Profile
method: PUT
url: '{{baseUrl}}/api/v1/users/updateMe'
order: 2000
body:
  type: formdata
  content:
    - key: name
      type: text
      value: 'John Doe'
    - key: email
      type: text
      value: 'john@example.com'
    - key: phone
      type: text
      value: '+1234567890'
    - key: profileImage
      type: file
      src: ''
