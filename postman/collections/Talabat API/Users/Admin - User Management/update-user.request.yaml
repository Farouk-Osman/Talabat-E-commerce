$kind: http-request
name: Update User
method: PUT
url: '{{baseUrl}}/api/v1/users/{{userId}}'
order: 4000
body:
  type: formdata
  content:
    - key: name
      type: text
      value: 'John Doe'
    - key: email
      type: text
      value: 'john@example.com'
    - key: phone
      type: text
      value: '+1234567890'
    - key: role
      type: text
      value: 'user'
    - key: profileImage
      type: file
      src: ''
